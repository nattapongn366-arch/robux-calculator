<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำนวณ Robux</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3b2f3;
    }

    .calculator {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 25px;
    }

    .rate {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #e691e4;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="calculator">
    <h1>คำนวณราคา Robux</h1>

    <div class="rate">
      0.40 บาท = 1 Robux
    </div>

    <label for="robux">จำนวน Robux</label>

    <input
      type="number"
      id="robux"
      placeholder="เช่น 10"
      min="1"
    >

    <button onclick="calculate()">
      คำนวณราคา
    </button>

    <div class="result" id="result">
      <div>ราคาทั้งหมด</div>
      <div class="price" id="price">0 บาท</div>
    </div>
  </div>

  <script>
    function calculate() {
      const robux = Number(document.getElementById("robux").value);
      const result = document.getElementById("result");
      const price = document.getElementById("price");

      if (!robux || robux <= 0) {
        alert("กรุณากรอกจำนวน Robux");
        return;
      }

      const total = robux * 0.40;

      price.textContent =
        total.toLocaleString("th-TH", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) + " บาท";

      result.style.display = "block";
    }
  </script>

</body>
</html>
