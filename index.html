<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำนวณ Robux</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      .reset-btn {
  margin-top: 10px;
  background: #ddd;
  color: #222;
}

.reset-btn:hover {
  background: #ccc;
}
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3b2f3;
    }

    .calculator {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(250, 47, 47, 0.9372549019607843);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 25px;
    }

    .rate {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #e691e4;
      color: hwb(0 100% 0%);
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }
    .reset-btn {
  margin-top: 10px;
  background: #e53935;
  color: white;
}

.reset-btn:hover {
  background: #c62828;
}
  </style>
</head>

<body>

  <div class="calculator">
    <h1>คำนวณราคา Robux</h1>

    <div class="rate">
      0.40 บาท = 1 Robux
   
      <div class="rate">
     กรุณากรอกจำนวนเต็ม เช่น 5,10,15
    </div>

    <label for="robux">จำนวน Robux</label>

    <input
      type="number"
      id="robux"
      placeholder="ขั้นต่ำ 25"
      min="1"
    >

    <button onclick="calculate()">
  คำนวณราคา
</button>
<button onclick="resetCalculator()" class="reset-btn">
  รีเซ็ต
</button>

    <div class="result" id="result">
      <div>ราคาที่ต้องจ่าย</div>
      <div class="price" id="price">0 บาท</div>
    </div>
  </div>

  <script>
  function calculate() {
    const robux = Number(document.getElementById("robux").value);
    const result = document.getElementById("result");
    const price = document.getElementById("price");

    if (!robux || robux <= 0) {
      alert("กรุณากรอกจำนวน Robux");
      return;
    }

    const total = robux * 0.50;

    price.textContent =
      total.toLocaleString("th-TH", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " บาท";

    result.style.display = "block";
  }

  function resetCalculator() {
    document.getElementById("robux").value = "";
    document.getElementById("price").textContent = "0 บาท";
    document.getElementById("result").style.display = "none";
  }
  </script>
  
  </body>
  </html>
